name: Build Debian Packages (.deb)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: Build .deb (${{ matrix.target_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- AMD64 (x86_64) ---
          - target: x86_64-unknown-linux-gnu
            target_name: amd64-gnu
            deb_arch: amd64
            libc: gnu
            artifact_name: velox-amd64-gnu-deb
          - target: x86_64-unknown-linux-musl
            target_name: amd64-musl
            deb_arch: amd64
            libc: musl
            artifact_name: velox-amd64-musl-deb

          # --- 32-bit (i686) ---
          - target: i686-unknown-linux-gnu
            target_name: i686-gnu
            deb_arch: i386
            libc: gnu
            artifact_name: velox-i686-gnu-deb
          - target: i686-unknown-linux-musl
            target_name: i686-musl
            deb_arch: i386
            libc: musl
            artifact_name: velox-i686-musl-deb

          # --- ARM64 (aarch64) ---
          - target: aarch64-unknown-linux-gnu
            target_name: arm64-gnu
            deb_arch: arm64
            libc: gnu
            artifact_name: velox-arm64-gnu-deb
          - target: aarch64-unknown-linux-musl
            target_name: arm64-musl
            deb_arch: arm64
            libc: musl
            artifact_name: velox-arm64-musl-deb

          # --- ARM32 (armv7 / armhf) ---
          - target: armv7-unknown-linux-gnueabihf
            target_name: arm32-gnu
            deb_arch: armhf
            libc: gnu
            artifact_name: velox-arm32-gnu-deb
          - target: armv7-unknown-linux-musleabihf
            target_name: arm32-musl
            deb_arch: armhf
            libc: musl
            artifact_name: velox-arm32-musl-deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package version from VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Velox v${VERSION} for target ${{ matrix.target }}"

      - name: Cache generated icons
        id: icon-cache
        uses: actions/cache@v4
        with:
          path: assets/generated_icons
          key: velox-icons-${{ hashFiles('assets/icons/**', 'scripts/generate_icons.py') }}

      - name: Install asset generation tools
        if: steps.icon-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil librsvg2-bin

      - name: Generate icon assets
        if: steps.icon-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/generate_icons.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binaries with cross
        run: |
          cross build --release --locked --target ${{ matrix.target }} --bins

      - name: Build Debian (.deb) package
        run: |
          bash scripts/packaging/debian/build-deb.sh \
            --binary "target/${{ matrix.target }}/release/velox" \
            --arch "${{ matrix.deb_arch }}" \
            --version "${{ steps.version.outputs.VERSION }}" \
            --libc "${{ matrix.libc }}" \
            --output-dir "dist"

      - name: Upload Debian package artifact (Node 20 runtime)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.deb
          if-no-files-found: error
