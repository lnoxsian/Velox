name: Build Standalone Binary Tarballs (.tar.gz)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tarball:
    name: Build .tar.gz (${{ matrix.target_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- AMD64 (x86_64) ---
          - target: x86_64-unknown-linux-gnu
            target_name: amd64-gnu
            artifact_name: velox-amd64-gnu-tarball
          - target: x86_64-unknown-linux-musl
            target_name: amd64-musl
            artifact_name: velox-amd64-musl-tarball

          # --- 32-bit (i686) ---
          - target: i686-unknown-linux-gnu
            target_name: i686-gnu
            artifact_name: velox-i686-gnu-tarball
          - target: i686-unknown-linux-musl
            target_name: i686-musl
            artifact_name: velox-i686-musl-tarball

          # --- ARM64 (aarch64) ---
          - target: aarch64-unknown-linux-gnu
            target_name: arm64-gnu
            artifact_name: velox-arm64-gnu-tarball
          - target: aarch64-unknown-linux-musl
            target_name: arm64-musl
            artifact_name: velox-arm64-musl-tarball

          # --- ARM32 (armv7) ---
          - target: armv7-unknown-linux-gnueabihf
            target_name: arm32-gnu
            artifact_name: velox-arm32-gnu-tarball
          - target: armv7-unknown-linux-musleabihf
            target_name: arm32-musl
            artifact_name: velox-arm32-musl-tarball

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package version from VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Velox v${VERSION} for target ${{ matrix.target }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binaries with cross
        run: |
          cross build --release --locked --target ${{ matrix.target }} --bins

      - name: Build standalone binary tarball
        run: |
          bash scripts/packaging/tarball/build-tarball.sh \
            --binary "target/${{ matrix.target }}/release/velox" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.version.outputs.VERSION }}" \
            --output-dir "dist"

      - name: Upload Tarball Artifact (Node 20 runtime)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
