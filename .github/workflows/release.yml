name: Release Builds & Publishing

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark this release as pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create this release as a draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release-packages:
    name: Build Packages (${{ matrix.target_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- AMD64 (x86_64) ---
          - target: x86_64-unknown-linux-gnu
            target_name: amd64-gnu
            deb_arch: amd64
            rpm_arch: x86_64
            arch_arch: x86_64
            libc: gnu
            artifact_name: velox-release-amd64-gnu

          - target: x86_64-unknown-linux-musl
            target_name: amd64-musl
            deb_arch: amd64
            rpm_arch: x86_64
            arch_arch: x86_64
            libc: musl
            artifact_name: velox-release-amd64-musl

          # --- 32-bit (i686) ---
          - target: i686-unknown-linux-gnu
            target_name: i686-gnu
            deb_arch: i386
            rpm_arch: i686
            arch_arch: i686
            libc: gnu
            artifact_name: velox-release-i686-gnu

          - target: i686-unknown-linux-musl
            target_name: i686-musl
            deb_arch: i386
            rpm_arch: i686
            arch_arch: i686
            libc: musl
            artifact_name: velox-release-i686-musl

          # --- ARM64 (aarch64) ---
          - target: aarch64-unknown-linux-gnu
            target_name: arm64-gnu
            deb_arch: arm64
            rpm_arch: aarch64
            arch_arch: aarch64
            libc: gnu
            artifact_name: velox-release-arm64-gnu

          - target: aarch64-unknown-linux-musl
            target_name: arm64-musl
            deb_arch: arm64
            rpm_arch: aarch64
            arch_arch: aarch64
            libc: musl
            artifact_name: velox-release-arm64-musl

          # --- ARM32 (armv7 / armhf) ---
          - target: armv7-unknown-linux-gnueabihf
            target_name: arm32-gnu
            deb_arch: armhf
            rpm_arch: armv7hl
            arch_arch: armv7h
            libc: gnu
            artifact_name: velox-release-arm32-gnu

          - target: armv7-unknown-linux-musleabihf
            target_name: arm32-musl
            deb_arch: armhf
            rpm_arch: armv7hl
            arch_arch: armv7h
            libc: musl
            artifact_name: velox-release-arm32-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package version from VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Velox release v${VERSION} for ${{ matrix.target }}"

      - name: Install packaging dependencies (RPM, zstd)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zstd tar fakeroot

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binaries with cross
        run: |
          cross build --release --locked --target ${{ matrix.target }} --bins

      - name: Package standalone binary tarball (.tar.gz)
        run: |
          bash scripts/packaging/tarball/build-tarball.sh \
            --binary "target/${{ matrix.target }}/release/velox" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.version.outputs.VERSION }}" \
            --output-dir "dist"

      - name: Package Debian (.deb)
        run: |
          bash scripts/packaging/debian/build-deb.sh \
            --binary "target/${{ matrix.target }}/release/velox" \
            --arch "${{ matrix.deb_arch }}" \
            --version "${{ steps.version.outputs.VERSION }}" \
            --libc "${{ matrix.libc }}" \
            --output-dir "dist"

      - name: Package Fedora / RHEL (.rpm)
        run: |
          bash scripts/packaging/fedora/build-rpm.sh \
            --binary "target/${{ matrix.target }}/release/velox" \
            --arch "${{ matrix.rpm_arch }}" \
            --version "${{ steps.version.outputs.VERSION }}" \
            --libc "${{ matrix.libc }}" \
            --output-dir "dist"

      - name: Package Arch Linux (.pkg.tar.zst)
        run: |
          bash scripts/packaging/arch/build-arch.sh \
            --binary "target/${{ matrix.target }}/release/velox" \
            --arch "${{ matrix.arch_arch }}" \
            --version "${{ steps.version.outputs.VERSION }}" \
            --libc "${{ matrix.libc }}" \
            --output-dir "dist"

      - name: Upload Matrix Artifacts (Node 20 runtime)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.*
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package version from VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Preparing release v${VERSION}"

      - name: Create release staging directory
        run: mkdir -p dist-release

      - name: Download all build artifacts (Node 20 runtime)
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate master SHA256SUMS file
        run: |
          cd dist-release
          # Compute checksums for all distribution packages (excluding individual .sha256 files)
          find . -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.*" -o -name "*.tar.gz" \) -exec sha256sum {} + | sed 's|  \./|  |' | sort -k2 > SHA256SUMS.txt
          echo "=================================================="
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt
          echo "=================================================="

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Velox v${{ steps.version.outputs.VERSION }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist-release/*.deb
            dist-release/*.rpm
            dist-release/*.pkg.tar.*
            dist-release/*.tar.gz
            dist-release/*.sha256
            dist-release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
