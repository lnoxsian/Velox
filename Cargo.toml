[package]
name = "velox"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"
glow = "0.16"
nix = "0.30"
rustix = "1"
bytemuck = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
smallvec = "1"
bitflags = { version = "2", features = ["serde"] }
