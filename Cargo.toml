[package]
name = "velox"
version = "0.2.1"
edition = "2024"

[dependencies]
nix = { version = "0.30", features = ["fs", "process", "term"] }
unicode-width = "0.2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
bincode = "1"
log = "0.4"
env_logger = "0.11"
smallvec = "1"
bitflags = { version = "2", features = ["serde"] }
ab_glyph = "0.2"
libc = "0.2"
fontdb = "0.23"
png = "0.17"
owned_ttf_parser = "0.25"
memmap2 = "0.9"
ahash = "0.8"
x11rb = { version = "0.14.0", default-features = false, features = ["shm", "randr"] }
wayland-client = { version = "0.31.15", default-features = false }
wayland-protocols = { version = "0.32.13", default-features = false, features = ["client", "staging"] }

[[bench]]
name = "software_renderer"
harness = false

[[bench]]
name = "terminal_throughput"
harness = false

[[bench]]
name = "memory_benchmark"
harness = false

[profile.optimized-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
