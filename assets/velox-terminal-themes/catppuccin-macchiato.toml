single_instance = true

[font]
font_family = "monospace"
font_size = 12.0
font_scale_multiplier = 1.5
bold_is_bright = true

[window]
scrollback_limit = 2000
infinite_scrollback = true
gpu_acceleration = true
scroll_multiplier = 5.0
fps_limit = 120
padding_x = 8.0
padding_y = 4.0
cursor_shape = "beam"
cursor_blink = true
scroll_on_output = true
scroll_on_keystroke = true

[colors]
default_fg = "#cad3f5"
default_bg = "#24273a"
black = "#494d64"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#f5bde6"
cyan = "#8bd5ca"
white = "#b8c0e0"
bright_black = "#5b6078"
bright_red = "#ed8796"
bright_green = "#a6da95"
bright_yellow = "#eed49f"
bright_blue = "#8aadf4"
bright_magenta = "#f5bde6"
bright_cyan = "#8bd5ca"
bright_white = "#cad3f5"
