single_instance = true

[font]
font_family = "monospace"
font_size = 12.0
font_scale_multiplier = 1.5
bold_is_bright = true

[window]
scrollback_limit = 2000
infinite_scrollback = true
gpu_acceleration = true
scroll_multiplier = 5.0
fps_limit = 120
padding_x = 8.0
padding_y = 4.0
cursor_shape = "beam"
cursor_blink = true
scroll_on_output = true
scroll_on_keystroke = true

[colors]
default_fg = "#e6edf3"
default_bg = "#0d1117"
black = "#484f58"
red = "#ff7b72"
green = "#7ee787"
yellow = "#d29922"
blue = "#58a6ff"
magenta = "#bc8cff"
cyan = "#39c5cf"
white = "#b1bac4"
bright_black = "#6e7681"
bright_red = "#ffa198"
bright_green = "#56d364"
bright_yellow = "#e3b341"
bright_blue = "#79c0ff"
bright_magenta = "#d2a8ff"
bright_cyan = "#56d4dd"
bright_white = "#f0f6fc"
