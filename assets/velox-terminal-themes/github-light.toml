single_instance = true

[font]
font_family = "monospace"
font_size = 12.0
font_scale_multiplier = 1.5
bold_is_bright = true

[window]
scrollback_limit = 2000
infinite_scrollback = true
gpu_acceleration = true
scroll_multiplier = 5.0
fps_limit = 120
padding_x = 8.0
padding_y = 4.0
cursor_shape = "beam"
cursor_blink = true
scroll_on_output = true
scroll_on_keystroke = true

[colors]
default_fg = "#1f2328"
default_bg = "#ffffff"
black = "#24292f"
red = "#cf222e"
green = "#116329"
yellow = "#4d2d00"
blue = "#0969da"
magenta = "#8250df"
cyan = "#1b7c83"
white = "#6e7781"
bright_black = "#57606a"
bright_red = "#a40e26"
bright_green = "#1a7f37"
bright_yellow = "#633c01"
bright_blue = "#218bff"
bright_magenta = "#a475f9"
bright_cyan = "#3192aa"
bright_white = "#8c959f"
