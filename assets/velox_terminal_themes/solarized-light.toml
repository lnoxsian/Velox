single_instance = true

[font]
font_family = "ComicShannsMono Nerd Font"
font_size = 12.0
font_scale_multiplier = 1.5
bold_is_bright = true

[window]
scrollback_limit = 2000
infinite_scrollback = true
gpu_acceleration = true
scroll_multiplier = 5.0
fps_limit = 120
padding_x = 4.0
padding_y = 4.0
cursor_shape = "block"
cursor_blink = true
scroll_on_output = false
scroll_on_keystroke = true
opacity = 0.75

[colors]
default_fg = "#657b83"
default_bg = "#fdf6e3"
black = "#073642"
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"
white = "#eee8d5"
bright_black = "#586e75"
bright_red = "#cb4b16"
bright_green = "#859900"
bright_yellow = "#b58900"
bright_blue = "#268bd2"
bright_magenta = "#6c71c4"
bright_cyan = "#2aa198"
bright_white = "#fdf6e3"
