# Velox Terminal Emulator Configuration
# Location: ~/.config/velox/config.toml

# Top-level settings
shell = "/bin/bash"
app_title = "{program} - Velox"
single_instance = true

[font]
font_family = "monospace"
font_size = 12.0
font_scale_multiplier = 1.5
bold_is_bright = true

[window]
scrollback_limit = 2000
infinite_scrollback = true
gpu_acceleration = true
scroll_multiplier = 5.0
fps_limit = 120
padding_x = 8.0
padding_y = 4.0
cursor_shape = "beam"         # Options: "block", "beam", "underline", "hollow_block"
cursor_blink = true
cursor_color = "default"      # Options: "default", "inverted", or hex color like "#d4d4d4"
cursor_text_color = "default" # Options: "default", "inverted", or hex color like "#181818"
scroll_on_output = true
scroll_on_keystroke = true
opacity = 1.0                 # Value between 0.0 (transparent) and 1.0 (opaque)

[tabs]
tab_accent_color = "blue"      # Options: theme color names ("red", "green", "yellow", "blue", "magenta", "cyan", "white", "black", "default_fg", "default_bg", "cursor"), hex color like "#2472c8", or "default"
font_size = "default"         # Options: number (e.g. 11, 11.0) or "default" (inherits [font] font_size)

[colors]
default_fg = "#d4d4d4"
default_bg = "#181818"

# 16-color ANSI palette
black = "#000000"
red = "#cd3131"
green = "#0dbc79"
yellow = "#e5e510"
blue = "#2472c8"
magenta = "#bc3fbc"
cyan = "#11a8cd"
white = "#e5e5e5"

bright_black = "#666666"
bright_red = "#f14c4c"
bright_green = "#23d18b"
bright_yellow = "#f5f543"
bright_blue = "#3b8eea"
bright_magenta = "#d670d6"
bright_cyan = "#29b8db"
bright_white = "#ffffff"
